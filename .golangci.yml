version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/lemon4ksan/seal)

    gofumpt:
      module-path: github.com/lemon4ksan/seal
      extra:
        group-params: true

    goimports:
      local-prefixes:
        - github.com/lemon4ksan/seal

    golines:
      max-len: 120

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - nilerr
    - errorlint
    - gocritic
    - prealloc
    - perfsprint
    - gosec

  settings:
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - linters: [gosec]
        text: "G103:"

      - linters: [gosec]
        text: "G404:"

      - linters: [gosec]
        text: "G115:"

      - linters: [gosec]
        text: "G306:|G301:|G304:|G302:"

      - linters: [gosec]
        text: "G401:|G501:|G505:"

      - linters: [revive]
        path: "_test\\.go"
        text: "exported: (exported|comment on exported)"

      - linters: [gosec, errcheck, prealloc, staticcheck, errorlint, gocritic, unused, perfsprint, ineffassign]
        path: "_test\\.go"

      - linters: [ineffassign, gocritic, gosec, unused, staticcheck, errcheck]
        path: "codec/compress/brotli/.*"

      - linters: [errorlint, gocritic, gosec, perfsprint, staticcheck, unused, gofumpt]
        path: "container/rar/internal/rardecode/.*"

      - linters: [unused, staticcheck, ineffassign]
        path: "codec/compress/flate/.*"

      - linters: [gocritic, unused, ineffassign, gosec]
        path: "codec/compress/huff0/.*"

      - linters: [errcheck, gocritic]
        path: "codec/compress/zstd/.*"

      - linters: [unused]
        path: "codec/compress/lzma/.*"

      - linters: [ineffassign]
        path: "text/encoding/.*"

      - linters: [gosec]
        text: "G703:|G706:|G104:"
        path: "(cmd|examples)/.*"

      - linters: [gocritic]
        text: "commentFormatting:"
        path: "libeon/.*"

    paths:
      - "examples/.*"
      - "tests/.*"
      - "codec/compress/brotli/.*"
      - "codec/compress/flate/.*"
      - "codec/compress/huff0/.*"
      - "codec/compress/zstd/.*"
      - "codec/compress/lzma/.*"
      - "container/rar/internal/rardecode/.*"
      - "text/encoding/.*"
